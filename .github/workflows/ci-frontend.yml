name: "CI - Frontend"

on:
  push:
    branches: [main]
    paths: ["apps/frontend/**"]
  pull_request:
    branches: [main]
    paths: ["apps/frontend/**"]

jobs:
  lint:
    name: "Lint (ESLint)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/frontend
          npm ci

      - name: Run ESLint
        run: |
          cd apps/frontend
          npm run lint

  build:
    name: "Build Validation"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd apps/frontend
          npm ci
      
      - name: Verifiy production build
        run: |
          cd apps/frontend
          npm run build
