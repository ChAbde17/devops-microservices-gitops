[project]
name = "devops-backend"
version = "1.0.0"
description = "FastAPI microservice backend for the DevOps GitOps platform"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
