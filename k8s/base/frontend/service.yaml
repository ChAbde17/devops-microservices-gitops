  name: frontend-svc
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: devops-microservices
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
