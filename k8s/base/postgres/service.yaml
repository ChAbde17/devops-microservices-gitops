apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: devops-microservices
spec:
  type: ClusterIP
  ClusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: tcp-pg
      port: 5432
      targetPort: tcp-pg
      protocol: TCP