apiVersion: v1
kind: Service
metadata:
  name: redis-svc
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: devops-microservices
spec:
  type: ClusterIP
  ClusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: tcp-redis
      port: 6379
      targetPort: tcp-redis
      protocol: TCP