apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devops-dev

resources:
  - ../../base

commonLabels:
  env: dev

patches:
  # Backend: 1 replica, low resources
  - target:
      kind: Deployment
      name: backend
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: backend
                resources:
                  requests:
                    cpu: 50m
                    memory: 128Mi
                  limits:
                    cpu: 250m
                    memory: 256Mi

  # Frontend: 1 replica
  - target:
      kind: Deployment
      name: frontend
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        replicas: 1

  # HPA: disable in dev (min=max=1)
  - target:
      kind: HorizontalPodAutoscaler
      name: backend-hpa
    patch: |
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: backend-hpa
      spec:
        minReplicas: 1
        maxReplicas: 1

  # ConfigMap: dev overrides
  - target:
      kind: ConfigMap
      name: backend-config
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: backend-config
      data:
        DEBUG: "true"
        CORS_ORIGINS: '["*"]'