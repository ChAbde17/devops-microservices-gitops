apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devops-staging

resources:
  - ../../base

commonLabels:
  env: staging

patches:
  # Backend: 2 replicas, medium resources
  - target:
      kind: Deployment
      name: backend
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        replicas: 2
        template:
          spec:
            containers:
              - name: backend
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi

  # Frontend: 2 replicas
  - target:
      kind: Deployment
      name: frontend
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        replicas: 2

  # HPA: 2-5 replicas in staging
  - target:
      kind: HorizontalPodAutoscaler
      name: backend-hpa
    patch: |
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: backend-hpa
      spec:
        minReplicas: 2
        maxReplicas: 5

  # ConfigMap: staging overrides
  - target:
      kind: ConfigMap
      name: backend-config
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: backend-config
      data:
        DEBUG: "false"
        CORS_ORIGINS: '["*"]'